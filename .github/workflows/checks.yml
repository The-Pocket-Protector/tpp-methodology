name: Methodology checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm test
      - run: npm run demo
      - run: npm run demo:pipeline
      - run: npm run demo:planmatch
      - run: npm run demo:calculator
